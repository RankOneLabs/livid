# Publishes to npm over OIDC — no token, no 2FA prompt, nothing stored.
#
# Requires a trusted publisher configured on each package at npmjs.com, naming
# this repository and this workflow file. npm will not let you configure one
# until the package exists, so the *first* version of each package has to be
# published by hand; every version after that comes through here.
#
# Provenance is attested automatically when publishing over OIDC, so packages
# get a verifiable link back to the commit and workflow that built them.
name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace to publish
        required: true
        type: choice
        options:
          - '@rankonelabs/livid-core'
          - '@rankonelabs/livid-svg'

permissions:
  contents: read
  # The whole point: lets the runner mint an OIDC token npm will trust.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Runner images ship an npm older than trusted publishing supports.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # A broken package is worse than an unpublished one, so the same gates
      # that guard a merge guard a release.
      - run: npm run check
      - run: npm test
      - run: npm run agents:check

      - name: Publish ${{ inputs.package }}
        run: npm publish --workspace ${{ inputs.package }}
